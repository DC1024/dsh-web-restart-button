# nginx.conf for the dsh container (runs unprivileged, foreground)
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # writable temp paths (we run as the unprivileged node user);
    # without all five, nginx tries /var/lib/nginx/{fastcgi,uwsgi,scgi} -> EACCES
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    client_max_body_size 256m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # $dsh_token is written by entrypoint.sh on every start.
        include /tmp/nginx-dsh-token.conf;

        # Stable bookmark: always exchanges the current launch token, so the
        # rotating ?token= URL never has to be copied by hand.
        location = /go {
            # absolute URL built from the client's own Host header: a bare
            # "/?token=..." would be rewritten to the internal listen port
            return 302 $scheme://$http_host/?token=$dsh_token;
        }

        # This service can execute shell commands on the host it runs on.
        # Never publish it on a LAN without a login in front of it.
        # Password file: ./htpasswd  (regenerate: openssl passwd -apr1 'new-pass')
        auth_basic "dsh (DeepSeek Harness)";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Browsers on a LAN IP (http://192.168.x.x) are a NON-secure context:
        # crypto.randomUUID is missing and the realtime channel hangs forever.
        # We inject a polyfill into the served HTML.
        location = /__dsh-polyfill.js {
            alias /usr/share/nginx/dsh-polyfill.js;
            default_type application/javascript;
        }

        # The floating restart button injected into the UI (see /__restart below).
        # Served straight from disk so it needs no build step in the app bundle.
        location = /__restart-btn.js {
            alias /usr/share/nginx/restart-button.js;
            default_type application/javascript;
        }

        # Restart switch. Basic Auth above applies, so only logged-in users can
        # bounce the service. Hitting it kills dsh; the entrypoint then ends the
        # container and Docker's restart policy rebuilds the stack.
        location = /__restart {
            proxy_pass http://127.0.0.1:8099;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location / {
            proxy_pass http://127.0.0.1:3080;

            proxy_http_version 1.1;

            # Must pass the original Host: the login cookie is bound to host+port
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade (message stream)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # SSE streaming: no buffering, long timeout
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # identity encoding so sub_filter can edit the HTML
            proxy_set_header Accept-Encoding "";
            # bump ?v= after editing the shim, otherwise browsers keep the cached copy
            sub_filter '</head>' '<script src="/__dsh-polyfill.js?v=2"></script><script src="/__restart-btn.js?v=1"></script></head>';
            sub_filter_once on;
        }
    }
}
